name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv pip install --system -e ".[dev]"
      - run: pre-commit run --all-files

  tests:
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v6
      - run: uv pip install --system -e ".[dev]"
      - run: pytest

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - run: uvx --from twine twine check --strict dist/*
      - name: Install and inspect wheel
        run: |
          wheel="$(find dist -name '*.whl' -print -quit)"
          sdist="$(find dist -name '*.tar.gz' -print -quit)"
          python scripts/check_sdist.py "$sdist"
          uv venv .package-venv
          uv pip install --python .package-venv/bin/python "$wheel"
          .package-venv/bin/python scripts/check_wheel.py "$wheel"
