name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.10"
          python-version: "3.12"
          enable-cache: true
      - run: uv venv --python 3.12
      - run: uv pip install --python .venv/bin/python -e ".[dev]"
      - run: .venv/bin/pre-commit run --all-files

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(github.event_name == 'push' && '["3.12", "3.13", "3.14"]' || '["3.12"]') }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.10"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv venv --python "${{ matrix.python-version }}"
      - run: uv pip install --python .venv/bin/python -e ".[dev]"
      - run: .venv/bin/python -m pytest

  package:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.10"
          python-version: "3.12"
          enable-cache: true
      - run: uv build
      - run: uvx --from twine twine check --strict dist/*
      - name: Install and inspect wheel
        run: |
          wheel="$(find dist -name '*.whl' -print -quit)"
          sdist="$(find dist -name '*.tar.gz' -print -quit)"
          python scripts/check_sdist.py "$sdist"
          uv venv .package-venv
          uv pip install --python .package-venv/bin/python "$wheel"
          .package-venv/bin/python scripts/check_wheel.py "$wheel"
