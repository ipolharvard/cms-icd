name: Live CMS artifacts

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 1 * *"

permissions:
  contents: read

jobs:
  current:
    name: Fresh current snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CMS_ICD_FRESH_CACHE: ${{ github.workspace }}/.cms-cache/current
      CMS_ICD_DIAGNOSTIC_DIR: .cms-diagnostics/current
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.10"
          python-version: "3.12"
          enable-cache: true
      - run: uv venv --python 3.12
      - run: uv pip install --python .venv/bin/python -e ".[dev]"
      - run: .venv/bin/python -m pytest -q --tb=line -m live_current tests/live
      - if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: current-cms-diagnostics
          path: |
            .cms-diagnostics/current
            .cms-cache/current/fy*/**/manifest.json
          if-no-files-found: ignore

  historical:
    name: Historical format regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CMS_ICD_LIVE_CACHE: ~/.cache/ipolharvard/cms_icd/live-tests
      CMS_ICD_DIAGNOSTIC_DIR: .cms-diagnostics/historical
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.10"
          python-version: "3.12"
          enable-cache: true
      - name: Select monthly cache generation
        id: cache-generation
        run: echo "value=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ipolharvard/cms_icd
          key: cms-icd-historical-${{ runner.os }}-${{ steps.cache-generation.outputs.value }}
      - run: uv venv --python 3.12
      - run: uv pip install --python .venv/bin/python -e ".[dev]"
      - run: .venv/bin/python -m pytest -q --tb=line -m live_historical tests/live
      - if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: historical-cms-diagnostics
          path: |
            .cms-diagnostics/historical
            ~/.cache/ipolharvard/cms_icd/live-tests/fy*/**/manifest.json
          if-no-files-found: ignore
