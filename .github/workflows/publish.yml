name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: python scripts/check_release_version.py
      - run: uv build
      - run: uvx --from twine twine check --strict dist/*
      - name: Install and inspect wheel
        run: |
          wheel="$(find dist -name '*.whl' -print -quit)"
          uv venv .package-venv
          uv pip install --python .package-venv/bin/python "$wheel"
          .package-venv/bin/python scripts/check_wheel.py "$wheel"
      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/cms-icd
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish package distributions
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247
