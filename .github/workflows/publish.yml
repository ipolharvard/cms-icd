name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.10"
          python-version: "3.12"
          enable-cache: true
      - run: python scripts/check_release_version.py
      - run: uv build
      - run: uvx --from twine twine check --strict dist/*
      - name: Install and inspect wheel
        run: |
          wheel="$(find dist -name '*.whl' -print -quit)"
          sdist="$(find dist -name '*.tar.gz' -print -quit)"
          python scripts/check_sdist.py "$sdist"
          uv venv .package-venv
          uv pip install --python .package-venv/bin/python "$wheel"
          .package-venv/bin/python scripts/check_wheel.py "$wheel"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/cms-icd
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish package distributions
        uses: pypa/gh-action-pypi-publish@v1.14.2
