name: Exhaustive CMS compatibility

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exhaustive:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CMS_ICD_LIVE_CACHE: ${{ github.workspace }}/.cms-cache/exhaustive
      CMS_ICD_DIAGNOSTIC_DIR: .cms-diagnostics/exhaustive
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.10"
          python-version: "3.12"
          enable-cache: true
      - run: uv venv --python 3.12
      - run: uv pip install --python .venv/bin/python -e ".[dev]"
      - run: .venv/bin/python -m pytest -q --tb=line -m live_exhaustive tests/live
      - if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: exhaustive-cms-diagnostics
          path: |
            .cms-diagnostics/exhaustive
            .cms-cache/exhaustive/fy*/**/manifest.json
          if-no-files-found: ignore
